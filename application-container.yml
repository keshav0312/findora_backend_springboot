spring:
  application:
    name: findora-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/findora}
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:${PORT:5000}}
  address: ${SERVER_ADDRESS:127.0.0.1}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript

findora:
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
  cors-origins: ${CORS_ORIGIN:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  proximity-alert-km: ${PROXIMITY_ALERT_KM:5}
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  seed: ${FINDORA_SEED:false}
  socket:
    host: ${SOCKET_HOST:127.0.0.1}
    port: ${SOCKET_PORT:5001}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:}
  whatsapp:
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:v20.0}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    root: INFO
    com.findora: INFO
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
